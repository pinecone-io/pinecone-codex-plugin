name: Contextualize Incoming Skills

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  contextualize:
    if: startsWith(github.head_ref, 'sync/skills-')
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Skip if last commit was from bot
        id: check_author
        run: |
          AUTHOR=$(git log -1 --format='%an')
          if [ "$AUTHOR" = "github-actions[bot]" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Run Claude Code
        if: steps.check_author.outputs.skip != 'true'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}
          claude_args: '--allowedTools "Read,Write,Edit,Bash(git:*),Bash(gh pr comment:*),Bash(mv:*),Bash(python3:*)"'
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            You are adapting incoming Pinecone skill files for the Codex plugin's conventions.
            There is no separate CLAUDE.md or AGENTS.md in this repo — the conventions are inlined below.
            Follow them exactly.

            ## Codex plugin conventions

            1. **Skill naming.** The upstream `pinecone-io/skills` repo uses hyphenated names
               like `pinecone-quickstart`. This Codex plugin uses bare slugs because the
               plugin manifest already namespaces them under `pinecone`.
               - In each `SKILL.md` frontmatter, the `name:` value must be the bare slug
                 (e.g. `name: quickstart`), NOT `pinecone-quickstart`.
               - Rename any skill directory that arrived with the `pinecone-` prefix:
                 `git mv skills/pinecone-foo skills/foo`.

            2. **Cross-skill references.** Inside skill bodies, references to sister skills
               should use the user-invocation form `pinecone:<skill>` (e.g. `pinecone:assistant`,
               `pinecone:cli`). Do NOT rewrite model names like `pinecone-sparse-english-v0`
               or org/package paths like `pinecone-io/...` or `@pinecone-database/...`.

            3. **No `allowed-tools` frontmatter.** Codex skills do not declare an
               `allowed-tools` field — that is a Claude Code convention. If upstream
               added one, strip it.

            4. **No `AskUserQuestion` references.** That is a Claude-only tool. Keep
               generic prose like "ask the user which option they prefer."

            5. **Environment variables.** Codex inherits the user's shell environment, so
               keep `export PINECONE_API_KEY="your-key"` as the primary instruction and
               de-emphasize the `.env` fallback to a one-liner at most.

            6. **MCP availability.** The Pinecone MCP server is bundled via `.mcp.json` and
               will be installed when a user installs this plugin. Skills can call MCP
               tools without re-checking installation; only check `PINECONE_API_KEY`.

            7. **Source tags in Python scripts.** Every `Pinecone(...)` constructor that
               sets `source_tag=` must use the prefix `codex_plugin:` followed by the skill
               name (optionally with an operation suffix). Lowercase letters, digits,
               underscores, and colons only.
               Examples:
                 source_tag="codex_plugin:assistant"
                 source_tag="codex_plugin:quickstart_upsert"
                 source_tag="codex_plugin:full_text_search_ingest"
               Rewrite any `pinecone_skills:*`, `claude_code_plugin:*`, `cursor_plugin:*`,
               or other sibling-plugin tags to use `codex_plugin:`. Leave the rest of the
               Python file untouched.

            8. **Manifest, marketplace, and workflows are off-limits.** Do NOT modify
               `.codex-plugin/`, `.agents/plugins/`, `.mcp.json`, `.github/`, `scripts/`,
               `README.md`, `CHANGELOG.md`, `docs/`, or `LICENSE`. Only touch files inside
               `skills/`.

            ## What to do on this PR

            1. Inspect the diff against `main` to see which skill files changed.
            2. For each changed file under `skills/`, apply the conventions above.
               - Only modify `.md` files and the specific `source_tag` literals inside
                 `.py` files. Do NOT alter Python logic.
               - Do not change the meaning or content of any skill.
               - Only change structure, formatting, field names, terminology, or source-tag
                 prefixes as described above.
            3. Rename any skill directories that arrived with the `pinecone-` prefix.
            4. Run `python3 scripts/check_all.py` and fix anything it flags inside the
               `skills/` tree. If the validators still fail after a reasonable attempt,
               stop and surface the failures in your PR comment instead of force-fixing them.
            5. Commit your changes directly to this branch with the message:
               "contextualize: adapt synced skills for this plugin"
            6. Post one PR comment via `gh pr comment` that lists:
               - what you changed in each file and why
               - what you intentionally left unchanged
               - any redundancies (existing skills or commands) the reviewer should
                 consider — flag them, do NOT remove them yourself

            Do not open a new PR. Do not modify files outside `skills/`.

      - name: Create test marketplace
        if: steps.check_author.outputs.skip != 'true'
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          git pull --rebase origin $BRANCH
          mkdir -p test-marketplace/.agents/plugins
          jq -n --arg branch "$BRANCH" '{
            "name": "pinecone-codex-plugins-pr-test",
            "interface": {"displayName": "Pinecone for Codex (PR branch)"},
            "plugins": [{
              "name": "pinecone",
              "source": {
                "source": "git-subdir",
                "url": "https://github.com/pinecone-io/pinecone-codex-plugin.git",
                "path": "./",
                "ref": $branch
              },
              "policy": {
                "installation": "AVAILABLE",
                "authentication": "ON_INSTALL"
              },
              "category": "Productivity"
            }]
          }' > test-marketplace/.agents/plugins/marketplace.json
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add test-marketplace/.agents/plugins/marketplace.json
          git diff --staged --quiet || git commit -m "chore: add test marketplace for branch testing"
          git push origin HEAD:$BRANCH
