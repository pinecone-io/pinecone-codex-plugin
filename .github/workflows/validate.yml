name: Validate Plugin

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Run plugin validators
        run: python3 scripts/check_all.py
      - name: Byte-compile Python scripts
        run: python -m compileall -q scripts skills
      - name: Lint Python scripts (ruff, error-level)
        run: |
          python -m pip install --upgrade pip ruff
          ruff check --select E9,F63,F7,F82 scripts skills
